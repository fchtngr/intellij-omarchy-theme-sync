name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build plugin
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version manifest.json)" = "$VERSION"
          ./gradlew buildPlugin
          cp build/distributions/omarchy-theme-sync-"$VERSION".zip build/distributions/omarchy-theme-sync-bridge.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-distribution
          path: build/distributions/omarchy-theme-sync-bridge.zip
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/omarchy-theme-sync-bridge.zip
          generate_release_notes: true
