name: Verify

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  verify:
    name: Verify plugin compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify plugin
        run: |
          jq -e . manifest.json >/dev/null
          bash -n install.sh test/install-test.sh
          python -m py_compile scripts/omarchy-intellij-theme-sync.py
          ./test/install-test.sh
          ./gradlew verifyPlugin
